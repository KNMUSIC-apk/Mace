# =========================================================
#  MaceLimiter - Configuration
# =========================================================

# Số lượng Mace tối đa trên server.
# Chỉ chặn CRAFT — plugin vẫn auto-adopt mọi Mace có sẵn để phản ánh đúng thực tế.
max-maces: 8

# Bật log debug trong console (dùng khi troubleshoot).
debug: false

# Gộp nhiều thay đổi data rồi ghi 1 lần (giảm disk I/O).
# Đơn vị: ticks (20 ticks = 1 giây). Khuyến nghị 40-100.
save-debounce-ticks: 40

# Bật auto-scan toàn server khi plugin enable.
scan-on-startup: true

# Delay trước khi startup scan chạy (ticks). Tăng nếu server yếu.
startup-scan-delay-ticks: 40

