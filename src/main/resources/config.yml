# =========================================================
#  MaceLimiter - Configuration
# =========================================================

# Số lượng Mace tối đa được tồn tại trên server.
# Khi đạt giới hạn, người chơi không thể craft thêm Mace.
#
# LƯU Ý: max-maces CHỈ chặn craft. Plugin vẫn tự động adopt
# (đếm) Mace có sẵn trên server dù vượt quá giới hạn — để phản
# ánh đúng thực tế. Ví dụ: server có 12 Mace, max = 8 → count là
# "12/8", craft bị chặn cho đến khi count giảm xuống < 8.
max-maces: 10

# Tin nhắn (mã màu legacy: &a &c &e &l &o &n ...).
# Placeholders:
#   %current%, %max%              -> limit-reached / limit-info
#   %fake%, %adopted%, %orphans%  -> sync-success
#   %max%                         -> reload-success
messages:
  no-permission: "&cBạn không có quyền sử dụng lệnh này."
  limit-reached: "&cServer đã đạt giới hạn Mace! &7(&e%current%&7/&e%max%&7)"
  limit-info: "&eHiện đang có &c%current%&e/&c%max% &eMace trên server."
  reset-success: "&aĐã reset toàn bộ dữ liệu Mace về 0. Mace cũ sẽ tự động bị xóa khi chạm vào."
  sync-start: "&7Đang đồng bộ dữ liệu Mace, vui lòng đợi..."
  sync-success: "&aĐồng bộ xong! &7Xóa &c%fake% &7UUID ảo, tự nhận &a%adopted% &7Mace mới, phát hiện &e%orphans% &7Mace mồ côi. &7Hiện có &c%current%&7/&c%max%&7."
  invalid-mace-removed: "&cMace không hợp lệ đã bị xóa khỏi túi đồ của bạn!"
  reload-success: "&aĐã reload config.yml thành công! Giới hạn Mace hiện tại: &e%max%&a."
  usage-mace: "&eSử dụng: &c/mace reload &7- Reload lại file config.yml."
